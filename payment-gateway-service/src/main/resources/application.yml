server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: payment-gateway-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

services:
  processor:
    base-url: ${PROCESSOR_SERVICE_URL:http://localhost:8081}

security:
  api-keys:
    - test-api-key-001
    - test-api-key-002

rate-limit:
  requests-per-minute: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"
  level:
    com.yuno: DEBUG
