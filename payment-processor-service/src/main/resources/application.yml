server:
  port: 8081
#  port:7889

spring:
  application:
    name: payment-processor-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yunopaymentsdb}
    username: ${DB_USERNAME:yunouser}
    password: ${DB_PASSWORD:yunopassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  jackson:
    serialization:
      write-dates-as-timestamps: false

services:
  provider:
    base-url: ${PROVIDER_SERVICE_URL:http://localhost:8082}
  idempotency:
    base-url: ${IDEMPOTENCY_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"
  level:
    com.yuno: DEBUG
    org.flywaydb: INFO
